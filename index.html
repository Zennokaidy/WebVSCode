    function setupNexusAI() {
      const nexusWindow = document.getElementById('nexusWindow');
      const nexusTitleBar = document.getElementById('nexusTitleBar');
      const nexusMinimizeBtn = document.getElementById('nexusMinimizeBtn');
      const nexusCloseBtn = document.getElementById('nexusCloseBtn');
      const nexusActivityBtn = document.getElementById('activity-nexusai');
      const nexusFrame = document.getElementById('nexusFrame');

      let nexusIsMinimized = false;
      let nexusIsDragging = false;
      let nexusIsResizing = false;
      let nexusResizeDir = '';
      let nexusDragOffsetX = 0, nexusDragOffsetY = 0;
      let nexusResizeStartX = 0, nexusResizeStartY = 0;
      let nexusResizeWinLeft = 0, nexusResizeWinTop = 0, nexusResizeWinWidth = 0, nexusResizeWinHeight = 0;
      let iframeLoaded = false;
      let rafId = null;
      let pendingLeft = 0, pendingTop = 0, pendingWidth = 0, pendingHeight = 0;
      let resizeRafId = null;

      function getNexusPos(e) {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        if (e.changedTouches && e.changedTouches.length > 0) {
          return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function openNexus() {
        // Carrega o iframe apenas na primeira abertura (lazy loading)
        if (!iframeLoaded) {
          nexusFrame.src = nexusFrame.dataset.src;
          iframeLoaded = true;
        }

        nexusWindow.classList.add('active');
        nexusWindow.classList.remove('closing');
        nexusWindow.classList.remove('minimized');
        nexusIsMinimized = false;

        // Centralizar via transform
        nexusWindow.style.transform = 'translate(-50%, -50%)';
        nexusWindow.style.left = '50%';
        nexusWindow.style.top = '50%';
        nexusWindow.style.width = '80vw';
        nexusWindow.style.height = '80vh';

        nexusActivityBtn.classList.add('active');
      }

      function closeNexus() {
        nexusWindow.classList.add('closing');
        setTimeout(() => {
          nexusWindow.classList.remove('active');
          nexusWindow.classList.remove('closing');
          nexusActivityBtn.classList.remove('active');
        }, 180);
      }

      function toggleNexusMinimize() {
        if (nexusIsMinimized) {
          nexusWindow.classList.remove('minimized');
          nexusIsMinimized = false;
          const rect = nexusWindow.getBoundingClientRect();
          if (rect.top < 0) nexusWindow.style.top = '20px';
          if (rect.left < -100) nexusWindow.style.left = '20px';
        } else {
          nexusWindow.classList.add('minimized');
          nexusIsMinimized = true;
        }
      }

      // Botão da activity bar
      nexusActivityBtn.addEventListener('click', () => {
        if (nexusWindow.classList.contains('active')) {
          closeNexus();
        } else {
          openNexus();
        }
      });

      // Minimizar
      nexusMinimizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNexusMinimize();
      });
      nexusMinimizeBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        toggleNexusMinimize();
      });

      // Fechar
      nexusCloseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeNexus();
      });
      nexusCloseBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        closeNexus();
      });

      // ============== DRAG OTIMIZADO ==============
      // Durante o drag, o iframe é desabilitado com pointer-events:none
      // e as posições são aplicadas via requestAnimationFrame

      function nexusApplyDragPosition() {
        rafId = null;
        nexusWindow.style.left = pendingLeft + 'px';
        nexusWindow.style.top = pendingTop + 'px';
      }

      function nexusStartDrag(e) {
        if (e.button !== undefined && e.button !== 0) return;
        const pos = getNexusPos(e);
        const rect = nexusWindow.getBoundingClientRect();
        nexusDragOffsetX = pos.x - rect.left;
        nexusDragOffsetY = pos.y - rect.top;
        nexusIsDragging = true;
        nexusWindow.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
        // Remove o transform para poder mover por left/top
        nexusWindow.style.transform = 'none';
        nexusWindow.style.position = 'fixed';
        // Adiciona classe que desabilita o iframe (pointer-events: none)
        nexusWindow.classList.add('dragging');
        e.preventDefault();
      }

      function nexusMoveDrag(e) {
        if (!nexusIsDragging) return;
        const pos = getNexusPos(e);
        let newX = pos.x - nexusDragOffsetX;
        let newY = pos.y - nexusDragOffsetY;
        newY = Math.max(0, newY);
        const winW = nexusWindow.offsetWidth;
        const winH = nexusWindow.offsetHeight;
        const maxOffsetX = winW * 0.8;
        const maxOffsetY = winH * 0.8;
        newX = Math.max(-maxOffsetX, Math.min(newX, window.innerWidth - winW * 0.2));
        const maxBottom = window.innerHeight + maxOffsetY;
        newY = Math.min(newY, maxBottom - winH);

        pendingLeft = newX;
        pendingTop = newY;

        if (!rafId) {
          rafId = requestAnimationFrame(nexusApplyDragPosition);
        }
        e.preventDefault();
      }

      function nexusEndDrag() {
        if (nexusIsDragging) {
          nexusIsDragging = false;
          nexusWindow.style.cursor = '';
          document.body.style.userSelect = '';
          // Reativa o iframe
          nexusWindow.classList.remove('dragging');
          // Aplica posição final
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          nexusWindow.style.left = pendingLeft + 'px';
          nexusWindow.style.top = pendingTop + 'px';
        }
      }

      nexusTitleBar.addEventListener('mousedown', nexusStartDrag);
      document.addEventListener('mousemove', nexusMoveDrag);
      document.addEventListener('mouseup', nexusEndDrag);

      nexusTitleBar.addEventListener('touchstart', nexusStartDrag, { passive: false });
      document.addEventListener('touchmove', nexusMoveDrag, { passive: false });
      document.addEventListener('touchend', nexusEndDrag);

      // ============== RESIZE OTIMIZADO ==============

      function nexusApplyResize() {
        resizeRafId = null;
        nexusWindow.style.left = pendingLeft + 'px';
        nexusWindow.style.top = pendingTop + 'px';
        nexusWindow.style.width = pendingWidth + 'px';
        nexusWindow.style.height = pendingHeight + 'px';
      }

      function nexusStartResize(e) {
        if (nexusIsMinimized) return;
        const dir = e.currentTarget.dataset.resize;
        if (!dir) return;
        if (e.button !== undefined && e.button !== 0) return;
        const pos = getNexusPos(e);
        const rect = nexusWindow.getBoundingClientRect();
        nexusResizeWinLeft = rect.left;
        nexusResizeWinTop = rect.top;
        nexusResizeWinWidth = rect.width;
        nexusResizeWinHeight = rect.height;
        nexusResizeStartX = pos.x;
        nexusResizeStartY = pos.y;
        nexusIsResizing = true;
        nexusResizeDir = dir;
        nexusWindow.classList.add('resizing');
        document.body.style.userSelect = 'none';
        nexusWindow.style.position = 'fixed';
        nexusWindow.style.transform = 'none';
        e.preventDefault();
      }

      function nexusMoveResize(e) {
        if (!nexusIsResizing) return;
        const pos = getNexusPos(e);
        const dx = pos.x - nexusResizeStartX;
        const dy = pos.y - nexusResizeStartY;
        let newLeft = nexusResizeWinLeft;
        let newTop = nexusResizeWinTop;
        let newWidth = nexusResizeWinWidth;
        let newHeight = nexusResizeWinHeight;
        const minW = 200, minH = 150;

        if (nexusResizeDir.includes('e')) {
          newWidth = Math.max(minW, nexusResizeWinWidth + dx);
        }
        if (nexusResizeDir.includes('w')) {
          const delta = Math.min(dx, nexusResizeWinWidth - minW);
          newWidth = nexusResizeWinWidth - delta;
          newLeft = nexusResizeWinLeft + delta;
        }
        if (nexusResizeDir.includes('s')) {
          newHeight = Math.max(minH, nexusResizeWinHeight + dy);
        }
        if (nexusResizeDir.includes('n')) {
          const maxDelta = nexusResizeWinTop;
          const delta = Math.min(dy, maxDelta, nexusResizeWinHeight - minH);
          newHeight = nexusResizeWinHeight - delta;
          newTop = nexusResizeWinTop + delta;
        }

        pendingLeft = newLeft;
        pendingTop = newTop;
        pendingWidth = newWidth;
        pendingHeight = newHeight;

        if (!resizeRafId) {
          resizeRafId = requestAnimationFrame(nexusApplyResize);
        }
        e.preventDefault();
      }

      function nexusEndResize() {
        if (nexusIsResizing) {
          nexusIsResizing = false;
          nexusWindow.classList.remove('resizing');
          document.body.style.userSelect = '';
          if (resizeRafId) {
            cancelAnimationFrame(resizeRafId);
            resizeRafId = null;
          }
          nexusWindow.style.left = pendingLeft + 'px';
          nexusWindow.style.top = pendingTop + 'px';
          nexusWindow.style.width = pendingWidth + 'px';
          nexusWindow.style.height = pendingHeight + 'px';
        }
      }

      document.querySelectorAll('.nexus-resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', nexusStartResize);
        handle.addEventListener('touchstart', nexusStartResize, { passive: false });
      });
      document.addEventListener('mousemove', nexusMoveResize);
      document.addEventListener('mouseup', nexusEndResize);
      document.addEventListener('touchmove', nexusMoveResize, { passive: false });
      document.addEventListener('touchend', nexusEndResize);

      // Duplo clique para minimizar
      nexusTitleBar.addEventListener('dblclick', (e) => {
        e.preventDefault();
        toggleNexusMinimize();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hasSaved = loadState();
      if (!hasSaved) {
        tree = deepCopy(DEFAULT_TREE);
        fileContents = deepCopy(DEFAULT_FILES);
      }

      applyLayoutMode();
      window.addEventListener('resize', applyLayoutMode);

      if (!isMobileLayout()) {
        openSidebar();
      }

      document.getElementById('activity-explorer').addEventListener('click', toggleSidebar);
      document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

      buildTree();

      document.getElementById('btn-collapse').addEventListener('click', () => {
        const allFolders = [];
        function collect(node) {
          if (node.type === 'folder') allFolders.push(node);
          if (node.children) node.children.forEach(collect);
        }
        tree.forEach(collect);
        allFolders.forEach(f => { f.open = false; });
        buildTree();
        saveState();
      });

      document.getElementById('btn-new-file').addEventListener('click', () => {
        createNewFile(null);
      });

      document.getElementById('btn-new-folder').addEventListener('click', () => {
        createNewFolder(null);
      });

      document.getElementById('btn-reset').addEventListener('click', resetState);

      document.getElementById('search-input').addEventListener('input', searchTree);

      document.getElementById('runButton').addEventListener('click', showPreview);

      document.getElementById('reloadBtn').addEventListener('click', reloadPreview);
      document.getElementById('closePreview').addEventListener('click', hidePreview);

      const dropdownBtn = document.getElementById('dropdownBtn');
      const dropdown = document.getElementById('previewDropdown');
      
      dropdownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', () => {
        dropdown.classList.remove('open');
      });

      document.getElementById('togglePreviewConsole').addEventListener('click', () => {
        dropdown.classList.remove('open');
        togglePreviewConsole();
      });

      document.getElementById('openBrowser').addEventListener('click', () => {
        dropdown.classList.remove('open');
        if (currentBlobUrl) {
          window.open(currentBlobUrl, '_blank');
        }
      });

      document.getElementById('backToEditor').addEventListener('click', () => {
        dropdown.classList.remove('open');
        hidePreview();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Shift') {
          shiftPressed = true;
        }
      });
      document.addEventListener('keyup', (e) => {
        if (e.key === 'Shift') {
          shiftPressed = false;
        }
      });

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveCurrentTab();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
          e.preventDefault();
          if (activeTabId !== null) closeTab(activeTabId);
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
          e.preventDefault();
          createNewFile(null);
        }
        if (e.key === 'F2' && selectedNodes.length === 1) {
          e.preventDefault();
          const node = findNode(tree, selectedNodes[0]);
          if (node) startRename(node);
        }
        if (e.key === 'Delete' && selectedNodes.length > 0) {
          e.preventDefault();
          deleteSelectedNodes();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          showPreview();
        }
        if (e.key === 'Escape') {
          const overlay = document.getElementById('previewOverlay');
          if (overlay.classList.contains('active')) {
            hidePreview();
          }
        }
      });

      document.addEventListener('dragstart', (e) => {
        if (e.target.closest('img, a')) e.preventDefault();
      });

      // Inicializa NexusAI
      setupNexusAI();

      require.config({ 
        paths: { 
          vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
        }
      });
      
      require(['vs/editor/editor.main'], function () {
        isMonacoReady = true;
        
        const initialContent = fileContents["Layout/game.js"] || '';
        const initialModel = monaco.editor.createModel(initialContent, 'javascript');
        editorModels.set("Layout/game.js", initialModel);
        
        editor = monaco.editor.create(document.getElementById('monaco-container'), {
          model: initialModel,
          theme: 'vs-dark',
          automaticLayout: true,
          fontSize: isMobileLayout() ? 15 : 13,
          minimap: { enabled: !isMobileLayout() },
          scrollBeyondLastLine: false,
          renderLineHighlight: 'all',
          wordWrap: 'on',
          wrappingIndent: 'indent',
          padding: { top: 10 },
          cursorBlinking: 'smooth',
          smoothScrolling: true,
          scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10 },
          suggest: {
            showKeywords: true,
            showSnippets: true,
            showFunctions: true,
            showConstructors: true,
            showDeprecated: true,
            showFields: true,
            showVariables: true,
            showClasses: true,
            showStructs: true,
            showInterfaces: true,
            showModules: true,
            showProperties: true,
            showEvents: true,
            showOperators: true,
            showUnits: true,
            showValues: true,
            showConstants: true,
            showEnums: true,
            showEnumMembers: true,
            showText: true,
            showColors: true,
            showFiles: true,
            showReferences: true,
            showFolders: true,
            showTypeParameters: true,
            showSnippets: true
          },
          quickSuggestions: {
            other: true,
            comments: true,
            strings: true
          },
          parameterHints: {
            enabled: true
          },
          snippetSuggestions: 'top'
        });

        monaco.languages.typescript.javascriptDefaults.setCompilerOptions({
          allowNonTsExtensions: true,
          allowJs: true,
          target: monaco.languages.typescript.ScriptTarget.ES2020,
          moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
          lib: ['es2020', 'dom']
        });

        monaco.languages.typescript.javascriptDefaults.addExtraLib(
          `declare class Game {
            score: number;
            level: number;
            isRunning: boolean;
            start(): void;
            update(deltaTime: number): void;
            render(): void;
          }`,
          'ts:game.d.ts'
        );

        monaco.languages.typescript.javascriptDefaults.addExtraLib(
          `declare class InputManager {
            keys: Record<string, boolean>;
            mouse: { x: number; y: number };
            setupListeners(): void;
            isKeyPressed(key: string): boolean;
          }`,
          'ts:input.d.ts'
        );

        monaco.languages.typescript.javascriptDefaults.addExtraLib(
          `declare class Renderer {
            canvas: HTMLCanvasElement;
            ctx: CanvasRenderingContext2D;
            constructor(canvasId: string);
            resize(): void;
            clear(): void;
            drawRect(x: number, y: number, width: number, height: number, color: string): void;
            drawCircle(x: number, y: number, radius: number, color: string): void;
          }`,
          'ts:render.d.ts'
        );

        editor.onDidChangeModelContent(() => {
          const tab = openTabs.find(t => t.id === activeTabId);
          if (tab && editor) {
            const current = editor.getValue();
            if (current !== tab.content) {
              tab.content = current;
              tab.modified = true;
              fileContents[tab.path] = current;
              renderTabs();
              saveState();
            }
          }
        });

        if (pendingFile) {
          updateEditor(pendingFile);
          pendingFile = null;
        }

        setupMobileAccessoryBar();
        setupPreviewConsoleMonaco();

        const initialFile = findNode(tree, 'Layout/game.js');
        if (initialFile && openTabs.length === 0) {
          openFile(initialFile);
        }
      });
    });
  })();
</script>
</body>
</html>
